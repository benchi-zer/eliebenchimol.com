<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elie Benchimol</title>
  <meta
    name="description"
    content="Elie Benchimol portfolio featuring portraits, views, and details."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="entry-mode">
  <section id="entry-view" class="entry-view" aria-label="Portfolio entrance">
    <img
      class="entry-image"
      src="build/previews/highres/portraits/SET10/p24-2000.webp"
      alt=""
      decoding="async"
      fetchpriority="high"
    />
    <div class="entry-copy">
      <h1>Sortir<br />de<br />l'ombre</h1>
      <div class="entry-manifesto">
        <p lang="en">
          10 years shooting had to end with an exhibition.
        </p>
      </div>
      <p class="entry-author">Elie Benchimol</p>
    </div>
    <nav class="entry-nav" aria-label="Choose a portfolio category">
      <button class="entry-nav-item" data-category="portraits" type="button">personas</button>
      <button class="entry-nav-item" data-category="views" type="button">formes</button>
      <button class="entry-nav-item" data-category="details" type="button">too close</button>
    </nav>
  </section>

  <div class="stage">
    <aside class="sidebar">
      <nav class="menu" aria-label="Main menu">
        <div id="category-menu" class="category-menu" aria-label="Portfolio categories">
          <button class="category-item is-active" data-category="portraits" type="button">personas</button>
          <button class="category-item" data-category="views" type="button">formes</button>
          <button class="category-item" data-category="details" type="button">too close</button>
        </div>
      </nav>
      <div class="mobile-progress" aria-hidden="true">
        <span class="mobile-progress-fill"></span>
      </div>
      <div class="mobile-dock" aria-label="Set navigation">
        <button id="mobile-prev-set" class="mobile-dock-button" type="button" aria-label="Previous set">&#8249;</button>
        <p id="mobile-set-indicator" class="mobile-set-indicator" aria-live="polite"></p>
        <button id="mobile-next-set" class="mobile-dock-button" type="button" aria-label="Next set">&#8250;</button>
      </div>
      <p class="mobile-dock-hint" aria-hidden="true">Touchez une image pour l’ouvrir</p>
    </aside>

    <button class="brand" type="button">Elie Benchimol</button>

    <main id="top" class="content">
      <section id="work-view" class="panel">
        <section id="gallery" class="gallery" aria-live="polite"></section>
      </section>
    </main>
  </div>

  <div
    id="high-res-image-viewer"
    class="high-res-image-viewer"
    aria-hidden="true"
    role="dialog"
    aria-label="High resolution image view"
  >
    <div class="high-res-image-strip" aria-live="polite"></div>
  </div>

  <script src="portfolio-data.js"></script>
  <script src="build/previews/set-variant-manifest.js"></script>
  <script src="script.js"></script>
</body>
</html>
